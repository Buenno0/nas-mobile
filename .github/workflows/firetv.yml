name: Fire TV

on:
  push:
    branches: [master]
    paths: ["firetv/**", ".github/workflows/firetv.yml"]
  pull_request:
    paths: ["firetv/**", ".github/workflows/firetv.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firetv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME) com as
      # licenças aceitas; o setup-android só baixava de novo, e falhava nisso.

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # `assembleAndroidTest` só compila os testes instrumentados; rodá-los exige
      # um emulador com imagem de TV, que não existe no runner. Compilar já pega
      # a dessincronização entre teste e interface, que foi como o teste de
      # autenticação ficou quebrado sem ninguém notar.
      - name: APK e testes instrumentados
        run: ./gradlew assembleDebug assembleAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: |
            firetv/app/build/reports/
            firetv/app/build/outputs/apk/debug/
          retention-days: 7
